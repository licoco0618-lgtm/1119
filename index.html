<!DOCTYPE html>
<html lang="zh-Hant" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>數位科技概論（上）線上學習與練習平台</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💻</text></svg>">
</head>
<body>

  <!-- 頂部導航列 -->
  <header class="navbar">
    <a href="#" class="brand">
      <div class="brand-icon">💻</div>
      <div>
        <span>數位科技概論 練習平台</span>
        <div style="font-size: 0.725rem; font-weight: normal; color: var(--text-muted);">
          第 3~6 章 隨堂測驗與習作大題庫 (共 103 題)
        </div>
      </div>
    </a>

    <!-- 功能切換標籤 -->
    <nav class="nav-tabs">
      <button class="tab-btn active" data-view="practice">
        <span>🎯</span> 刷題練習
      </button>
      <button class="tab-btn" data-view="exam">
        <span>⏱️</span> 模擬測驗
      </button>
      <button class="tab-btn" data-view="mistakes">
        <span>❌</span> 錯題本
      </button>
      <button class="tab-btn" data-view="flashcards">
        <span>📖</span> 考點速記
      </button>
      <button class="tab-btn" data-view="browse">
        <span>🔍</span> 題庫檢索
      </button>
    </nav>

    <!-- 輔助動作區 (深色模式切換) -->
    <div class="nav-actions">
      <button class="icon-btn" id="themeToggleBtn" title="切換深色/淺色主題">
        🌙
      </button>
    </div>
  </header>

  <!-- 主要內容區 -->
  <main class="main-container">
    <!-- 頂部即時統計卡片列 -->
    <section class="stats-banner">
      <div class="stat-card">
        <div class="stat-icon">📝</div>
        <div class="stat-info">
          <h4>已完成刷題</h4>
          <div class="stat-value" id="statTotal">0 / 103</div>
        </div>
      </div>

      <div class="stat-card">
        <div class="stat-icon" style="background: var(--success-bg); color: var(--success);">🎯</div>
        <div class="stat-info">
          <h4>答題正確率</h4>
          <div class="stat-value" id="statAccuracy">--%</div>
        </div>
      </div>

      <div class="stat-card">
        <div class="stat-icon" style="background: var(--error-bg); color: var(--error);">❌</div>
        <div class="stat-info">
          <h4>待複習錯題</h4>
          <div class="stat-value" id="statMistakes">0</div>
        </div>
      </div>

      <div class="stat-card">
        <div class="stat-icon" style="background: var(--warning-bg); color: var(--warning);">⭐</div>
        <div class="stat-info">
          <h4>星號收藏題</h4>
          <div class="stat-value" id="statBookmarks">0</div>
        </div>
      </div>
    </section>

    <!-- 視圖容器：1. 刷題練習模式 -->
    <section id="viewPractice" class="view-content">
      <!-- 由 js/app.js 動態渲染 -->
    </section>

    <!-- 視圖容器：2. 模擬測驗模式 -->
    <section id="viewExam" class="view-content" style="display: none;">
      <!-- 由 js/app.js 動態渲染 -->
    </section>

    <!-- 視圖容器：3. 錯題本模式 -->
    <section id="viewMistakes" class="view-content" style="display: none;">
      <!-- 由 js/app.js 動態渲染 -->
    </section>

    <!-- 視圖容器：4. 考點速記卡模式 -->
    <section id="viewFlashcards" class="view-content" style="display: none;">
      <!-- 由 js/app.js 動態渲染 -->
    </section>

    <!-- 視圖容器：5. 題庫檢索瀏覽模式 -->
    <section id="viewBrowse" class="view-content" style="display: none;">
      <!-- 由 js/app.js 動態渲染 -->
    </section>
  </main>

  <!-- 底部版權宣告與資訊 -->
  <footer style="text-align: center; padding: 1.5rem; color: var(--text-dim); font-size: 0.85rem; border-top: 1px solid var(--border-color); margin-top: auto;">
    數位科技概論（上）自主練習系統 • 涵蓋第 3、4、5、6 章全單元試題 • 支援本機離線作答與進度自動保存
  </footer>

  <!-- 載入題庫與應用邏輯 -->
  <script src="js/questions.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
